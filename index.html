<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DriveAssist OS - PRO v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Leaflet.js (APIキー不要地図) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cockpit: {
                            bg: '#05070A',
                            card: '#0D1117',
                            border: '#1E2633',
                            cyan: '#00E5FF',
                            amber: '#FFB300',
                            emerald: '#00E676',
                            danger: '#FF3D00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #05070A;
            color: #F3F4F6;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .glow-cyan { text-shadow: 0 0 18px rgba(0, 229, 255, 0.35); }
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(95%);
        }
        .leaflet-container { background: #090D16 !important; }
        .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2.5 sm:p-3.5 bg-cockpit-bg">

    <!-- ==================== トップステータスバー ==================== -->
    <header class="w-full flex flex-wrap items-center justify-between gap-2 bg-cockpit-card border border-cockpit-border rounded-2xl px-3.5 py-2.5 shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cockpit-cyan">
                <i class="fa-solid fa-gauge-high text-lg"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-bold text-sm sm:text-base tracking-wider text-white">DRIVE ASSIST <span class="text-cockpit-cyan text-xs font-mono px-1.5 py-0.5 bg-cyan-950 rounded border border-cyan-800">PRO v3.0</span></h1>
                </div>
                <p class="text-[11px] text-cockpit-emerald flex items-center gap-1.5 font-mono">
                    <span class="w-2 h-2 rounded-full bg-cockpit-emerald animate-pulse"></span>
                    OBD2 + NAVI + HIGHWAY IC ACTIVE (省電力警告抑制)
                </p>
            </div>
        </div>

        <!-- 目的地直接検索バー -->
        <div class="flex-1 max-w-md flex items-center gap-1.5 bg-black/70 border border-cockpit-border rounded-xl px-2.5 py-1.5">
            <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs"></i>
            <input id="quick-search-input" type="text" value="新東名 浜松SA" placeholder="目的地名を入力 (例: 名古屋駅, 浜松SA)" class="w-full bg-transparent text-xs sm:text-sm text-white focus:outline-none">
            <button onclick="searchDestination()" class="px-3 py-1 rounded-lg bg-cockpit-cyan text-black font-extrabold text-xs shrink-0 hover:bg-cyan-300 transition">
                検索・反映
            </button>
        </div>

        <!-- コントロールボタン -->
        <div class="flex items-center gap-1.5">
            <button onclick="openGoogleMapsExternal()" class="px-3 py-2 rounded-xl bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-700 text-cockpit-emerald font-bold text-xs flex items-center gap-1.5" title="Googleマップで開く">
                <i class="fa-solid fa-diamond-turn-right"></i><span class="hidden md:inline">Googleマップ連携</span>
            </button>
        </div>
    </header>

    <!-- ==================== 道路情報バナー（大型確認ボタン ＆ 一定秒数で自動消去） ==================== -->
    <div id="traffic-alert-banner" class="w-full my-2 bg-red-950/95 border-2 border-cockpit-danger rounded-2xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-2xl transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-red-600/30 border border-red-500 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-triangle-exclamation text-cockpit-danger text-xl animate-bounce"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-extrabold px-2 py-0.5 rounded bg-cockpit-danger text-white">前方交通障害検知</span>
                    <span id="alert-countdown" class="text-xs font-mono text-red-300">あと 12秒 で自動消去</span>
                </div>
                <p id="traffic-alert-msg" class="font-bold text-sm sm:text-base text-white mt-0.5">
                    前方ルート上：落下物・速度規制情報あり。安全に注意してください。
                </p>
            </div>
        </div>
        <!-- 指で押しやすい大型確認ボタン -->
        <button onclick="dismissTrafficAlert()" class="px-6 py-3.5 rounded-xl bg-cockpit-danger hover:bg-red-500 active:scale-95 text-white font-extrabold text-sm sm:text-base shadow-lg transition-all shrink-0 flex items-center gap-2">
            <i class="fa-solid fa-check text-lg"></i> 確認して閉じる
        </button>
    </div>

    <!-- ==================== メイン2カラムコックピット ==================== -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 my-1">

        <!-- 【左カラム：スリム速度計 ＆ 大型OBD2テレメトリ (5カラム)】 -->
        <section class="lg:col-span-5 flex flex-col justify-between bg-cockpit-card border border-cockpit-border rounded-3xl p-4 shadow-2xl gap-3">
            
            <!-- 1. コンパクト速度計 ＆ 最適巡航レンジ -->
            <div class="bg-black/60 border border-cockpit-border rounded-2xl p-3.5">
                <div class="flex items-center justify-between mb-1">
                    <span class="px-2 py-0.5 rounded text-[11px] font-extrabold bg-cyan-500/20 text-cockpit-cyan border border-cyan-400/40">
                        <i class="fa-solid fa-leaf mr-1"></i>EV / HYBRID
                    </span>
                    <span class="text-xs font-bold text-emerald-400">
                        最適巡航: <span class="font-mono text-sm">72〜80</span> km/h
                    </span>
                </div>

                <div class="flex items-center justify-between my-1">
                    <div class="flex items-baseline">
                        <span id="val-speed" class="font-mono text-6xl sm:text-7xl font-extrabold tracking-tighter text-white glow-cyan tabular-nums leading-none">
                            0
                        </span>
                        <span class="ml-2 text-base font-bold text-gray-400">km/h</span>
                    </div>

                    <div class="text-right w-36">
                        <div class="text-[11px] font-bold text
